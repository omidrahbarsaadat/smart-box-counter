name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: node --check web/app.js
      - name: Verify static web entrypoint
        run: test -f web/index.html && test -f web/styles.css && test -f web/favicon.svg
